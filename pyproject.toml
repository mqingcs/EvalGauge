[project]
name = "evalgauge"
version = "1.0.0"
description = "EvalGauge: Auditing Typed Scoring Semantics in Scientific VQA Benchmarks (MMM 2027)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Qing Mu", email = "qingmu@link.cuhk.edu.cn" },
  { name = "Jiani Zheng", email = "ninajnzheng@tencent.com" },
]
dependencies = [
  "anls==0.0.2",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "jinja2>=3.1",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "hypothesis>=6.120", "ruff>=0.9"]

[project.scripts]
evalgauge = "evalgauge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgauge"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
